<div class="map-controls">

    <!-- Botão principal -->
    <button
        id="toggleMapControls"
        class="map-button controls-toggle"
        type="button"
        title="Mostrar controles"
        aria-label="Mostrar controles"
        aria-expanded="true"
    >
        ×
    </button>

    <!-- Controles secundários -->
    <div id="mapControlsItems" class="map-controls-items">

        <button
            id="navigationButton"
            class="map-button navigation-button"
            type="button"
            title="Navegar"
            aria-label="Navegar"
        >
            ➤
        </button>

        <button
            id="locateButton"
            class="map-button"
            type="button"
            aria-label="Minha localização"
            title="Minha localização"
        >
            ◎
        </button>

        <button
            id="zoomInButton"
            class="map-button"
            type="button"
            aria-label="Aumentar zoom"
            title="Aumentar zoom"
        >
            +
        </button>

        <button
            id="zoomOutButton"
            class="map-button"
            type="button"
            aria-label="Diminuir zoom"
            title="Diminuir zoom"
        >
            −
        </button>

    </div>

</div>
