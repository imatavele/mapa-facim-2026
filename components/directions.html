<div
  id="liveNavigationBox"
  class="live-navigation-box hidden"
>
  <div class="live-navigation-header">
    <strong>Navegação</strong>

    <button
      id="closeLiveNavigation"
      type="button"
      aria-label="Fechar"
    >
      ×
    </button>
  </div>

  <div class="live-navigation-distance">
    <span>Do destino, está a</span><br>
    <strong id="liveNavigationDistance">—</strong>
  </div>

  <div class="live-navigation-direction">
    <span>Direção</span><br>
    <strong id="liveNavigationDirection">—</strong>
  </div>

  <div
    id="liveNavigationStatus"
    class="live-navigation-status"
  >
    A obter localização...
  </div>
</div>
